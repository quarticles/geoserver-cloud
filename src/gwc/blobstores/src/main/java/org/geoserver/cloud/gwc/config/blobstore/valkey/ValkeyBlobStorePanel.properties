# Valkey BlobStore Panel labels and tooltips

mode.title=Operation mode: standalone (tiles only in Valkey) or cache (Valkey as L1 cache)
delegateBlobStoreId.title=ID of the backend BlobStore to cache (required for cache mode)
addresses.title=Comma-separated list of Valkey server addresses
password.title=Authentication password (optional)
database.title=Valkey database index (0-15)
ttlSeconds.title=Time-to-live for cached tiles in seconds (0 = no expiry)
keyPrefix.title=Prefix for Valkey keys to namespace tiles
connectionPoolSize.title=Maximum connections in the pool
connectionMinIdleSize.title=Minimum idle connections
connectionTimeout.title=Connection timeout in milliseconds
clusterMode.title=Enable for Valkey/Redis Cluster deployments
clusterScanInterval.title=Interval for cluster topology scans in milliseconds
sentinelMode.title=Enable for Valkey/Redis Sentinel deployments
sentinelMasterName.title=Master name in Sentinel configuration
